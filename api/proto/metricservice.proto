syntax = "proto3";

// @version 1.0.0
// @description Metrics service API for storing metrics
package api.v1;

import "google/api/annotations.proto";

option go_package = "github.com/a-palonska/metrics-server/gen/proto;apiv1";

message Metric {
  string id = 1;
  string m_type = 2;
  oneof metric_value {
    int64 delta = 3;
    double value = 4;
  }
}

message CheckConnectionRequest {
}

message CheckConnectionResponse {
    int32 status = 1;
}

message UpdateMetricRequest {
    Metric metric = 1;
}

message UpdateMetricResponse {
    Metric metric = 1;
    int32 status = 2;
}

message UpdateMetricsRequest {
    repeated Metric metrics = 1;
}

message UpdateMetricsResponse {
    repeated Metric metrics = 1;
    int32 status = 2;
}

message ListAllMetricsRequest {
}

message ListAllMetricsResponse {
  repeated Metric metrics = 1;
}

message GetMetricRequest {
  Metric metric = 1;
}

message GetMetricResponse {
  Metric metric = 1;
  int32 status = 2;
}

service MetricsService {
  rpc CheckConnection(CheckConnectionRequest) returns (CheckConnectionResponse) {
    option (google.api.http) = {
      post: "/api/v1/ping"
      body: "*"
    };
  }
  rpc UpdateMetric(UpdateMetricRequest) returns (UpdateMetricResponse) {
    option (google.api.http) = {
      post: "/api/v1/update"
      body: "*"
    };
  }
  rpc UpdateMetrics(UpdateMetricsRequest) returns (UpdateMetricsResponse) {
    option (google.api.http) = {
      post: "/api/v1/updates"
      body: "*"
    };
  }
  rpc ListAllMetrics(ListAllMetricsRequest) returns (ListAllMetricsResponse) {
    option (google.api.http) = {
      get: "/api/v1/list"
    };
  }
  rpc GetMetric(GetMetricRequest) returns (GetMetricResponse) {
    option (google.api.http) = {
      post: "/api/v1/value"
      body: "*"
    };
  }
}
